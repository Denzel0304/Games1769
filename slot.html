<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>오늘의 행운 슬롯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night-1:#2a1a3e; --night-2:#43275f;
    --gold:#ffd24a; --gold-deep:#f5a623;
    --cream:#fff6e6; --cherry:#ff5470; --mint:#4ecdc4;
    --cell-h: clamp(70px, 24vw, 150px); /* JS overrides to fit screen exactly */
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; overflow:hidden; }
  body{
    font-family:'Fredoka','Jua',system-ui,sans-serif;
    background:radial-gradient(120% 90% at 50% -10%, var(--night-2) 0%, var(--night-1) 60%, #1b1029 100%);
    color:var(--cream);
    height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:14px 16px; user-select:none;
  }
  .machine{ width:100%; max-width:400px; height:100%; display:flex; flex-direction:column; gap:10px; }

  /* ----- header: centered title + mute on the right ----- */
  .topbar{ position:relative; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .title{
    font-family:'Jua',sans-serif; font-size:clamp(22px,7vw,30px); line-height:1; text-align:center;
    color:var(--gold); text-shadow:0 2px 0 #b9791a, 0 0 22px rgba(255,210,74,.35); letter-spacing:.5px;
    margin:0;
  }
  .reset{
    position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:42px; height:42px; border-radius:50%; border:2px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.06); cursor:pointer; display:grid; place-items:center;
    font-size:20px; color:var(--cream); transition:transform .12s ease;
  }
  .reset:active{ transform:translateY(-50%) scale(.9); }
  .mute{
    position:absolute; right:0; top:50%; transform:translateY(-50%);
    width:42px; height:42px; border-radius:50%; border:2px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.06); cursor:pointer; display:grid; place-items:center;
    transition:transform .12s ease;
  }
  .mute:active{ transform:translateY(-50%) scale(.9); }
  .mute svg{ width:20px; height:20px; }

  .coins{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.1));
    border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:9px 16px;
  }
  .coins .label{ font-size:13px; color:#cbb6e8; letter-spacing:1px; }
  .coins .amount{
    font-size:25px; font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums;
    text-shadow:0 1px 0 #b9791a; min-width:70px; text-align:right;
  }
  .coins .coinicon{ width:24px; height:24px; }

  /* ----- board fills remaining vertical space ----- */
  .display{
    position:relative; flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column;
    background:linear-gradient(180deg,#6b3fa0,#3d2456);
    border-radius:22px; padding:14px;
    box-shadow: inset 0 0 0 4px var(--gold-deep), inset 0 0 0 6px #7a4d12, 0 10px 30px rgba(0,0,0,.4);
  }
  .grid-wrap{ position:relative; flex:1 1 auto; min-height:0; }
  .grid-lock{
    display:none; position:absolute; inset:0; z-index:10;
    background:rgba(30,10,50,.45); border-radius:12px;
    backdrop-filter:blur(3px);
  }
  .grid-lock.active{ display:block; }
  .reels{
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    gap:8px; position:relative; z-index:2; height:100%;
  }
  .reel{
    overflow:hidden; border-radius:12px;
    background:linear-gradient(180deg,var(--cream),#fbe9c4);
    box-shadow: inset 0 5px 9px rgba(0,0,0,.18), inset 0 -5px 9px rgba(0,0,0,.12), 0 2px 0 rgba(255,255,255,.4);
    transition:box-shadow .25s, transform .25s;
  }
  .reel.hit{
    box-shadow: inset 0 0 0 3px var(--mint), 0 0 18px rgba(78,205,196,.7);
    transform:scale(1.04); animation:pulse .6s ease 2;
  }
  @keyframes pulse{ 50%{ transform:scale(1.09); } }
  .strip{ will-change:transform; }
  .reel.spinning .strip{ filter:blur(2px); }
  .cell{ height:var(--cell-h); display:grid; place-items:center; }
  .cell svg{ width:60%; height:60%; display:block; pointer-events:none; }

  .lines{ position:absolute; inset:0; z-index:5; pointer-events:none; overflow:visible; }
  .lines line{
    stroke-width:6; stroke-linecap:round; fill:none; opacity:.9;
    stroke-dasharray:400; stroke-dashoffset:400; animation:draw .5s ease forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .display.win{ animation:winflash .5s ease 3; }
  @keyframes winflash{
    0%,100%{ box-shadow: inset 0 0 0 4px var(--gold-deep), inset 0 0 0 6px #7a4d12, 0 10px 30px rgba(0,0,0,.4); }
    50%{ box-shadow: inset 0 0 0 4px var(--mint), inset 0 0 0 6px #fff, 0 0 40px rgba(78,205,196,.6); }
  }
  .display.shake{ animation:shake .4s ease; }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }

  .message{ flex:0 0 auto; text-align:center; font-family:'Jua',sans-serif; font-size:18px; min-height:26px; transition:opacity .2s; }
  .message.big{ color:var(--gold); font-size:22px; text-shadow:0 0 18px rgba(255,210,74,.5); }

  .spin{
    flex:0 0 auto;
    border:none; cursor:pointer; width:100%; padding:18px; border-radius:20px;
    font-family:'Jua',sans-serif; font-size:23px; color:#5a2a00;
    background:linear-gradient(180deg, #ffe27a, var(--gold) 45%, var(--gold-deep));
    box-shadow: 0 6px 0 #b9791a, 0 12px 24px rgba(245,166,35,.35);
    transition:transform .08s ease, box-shadow .08s ease; letter-spacing:2px;
  }
  .spin:active{ transform:translateY(5px); box-shadow:0 1px 0 #b9791a, 0 6px 14px rgba(245,166,35,.3); }
  .spin:disabled{ filter:saturate(.5) brightness(.92); cursor:default; }
  .spin .cost{ display:block; font-size:12px; font-family:'Fredoka',sans-serif; color:#7a4d12; margin-top:2px; letter-spacing:1px; }

  .betRow{ flex:0 0 auto; display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .betBtn{ width:100%; aspect-ratio:1/1; padding:0; font-size:18px; letter-spacing:1px; line-height:1.2; }
  .betBtn .pt{ font-size:10px; letter-spacing:0; display:block; }
  .betBtn .cost{ font-size:11px; }
  .betBtn.active{ box-shadow: inset 0 0 0 3px var(--mint), 0 6px 0 #b9791a, 0 12px 24px rgba(245,166,35,.35); }

  #confetti{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:50; }

  /* ----- 금괴 버튼 ----- */
  .goldbar-btn{
    position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:42px; height:42px; border-radius:50%; border:2px solid rgba(255,210,74,.35);
    background:rgba(255,210,74,.12); cursor:pointer; display:grid; place-items:center;
    font-size:20px; transition:transform .12s ease; position:relative;
  }
  .goldbar-btn:active{ transform:translateY(-50%) scale(.9); }
  .goldbar-badge{
    position:absolute; top:-4px; right:-4px;
    background:var(--cherry); color:#fff; font-size:10px; font-family:'Fredoka',sans-serif;
    font-weight:700; border-radius:10px; min-width:18px; height:18px;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
    line-height:1; pointer-events:none;
  }

  /* ----- 금괴 모달 ----- */
  .modal-overlay{
    position:fixed; inset:0; z-index:100;
    background:rgba(20,10,35,.75); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .modal-overlay.hidden{ display:none; }
  .modal-box{
    background:linear-gradient(160deg,#3d2456,#2a1a3e);
    border:2px solid var(--gold-deep); border-radius:24px;
    padding:24px 22px; width:100%; max-width:340px;
    box-shadow:0 20px 50px rgba(0,0,0,.6);
  }
  .modal-title{
    font-family:'Jua',sans-serif; font-size:20px; color:var(--gold);
    text-align:center; margin:0 0 6px;
    text-shadow:0 1px 0 #b9791a;
  }
  .modal-stock{
    text-align:center; font-size:16px; color:#cbb6e8; margin-bottom:18px;
  }
  .modal-stock strong{ color:var(--gold); font-size:20px; }
  .modal-tabs{
    display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:18px;
  }
  .modal-tab{
    padding:10px; border-radius:12px; border:2px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.05); cursor:pointer;
    font-family:'Jua',sans-serif; font-size:15px; color:var(--cream);
    transition:background .15s, border-color .15s;
  }
  .modal-tab.active{
    background:rgba(255,210,74,.18); border-color:var(--gold);
    color:var(--gold);
  }
  .modal-section{ display:none; }
  .modal-section.active{ display:block; }
  .modal-label{ font-size:12px; color:#cbb6e8; letter-spacing:.5px; margin-bottom:6px; }
  .modal-input-row{ display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .modal-input{
    flex:1; background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.15);
    border-radius:12px; padding:10px 12px; font-size:16px; font-family:'Fredoka',sans-serif;
    color:var(--cream); outline:none;
  }
  .modal-input:focus{ border-color:var(--gold); }
  .modal-result{
    background:rgba(255,210,74,.08); border:1px solid rgba(255,210,74,.2);
    border-radius:12px; padding:10px 14px; font-size:14px; color:#cbb6e8;
    margin-bottom:14px; text-align:center; min-height:40px; display:flex;
    align-items:center; justify-content:center;
  }
  .modal-result strong{ color:var(--gold); font-size:16px; }
  .modal-confirm{
    width:100%; padding:13px; border-radius:14px; border:none; cursor:pointer;
    font-family:'Jua',sans-serif; font-size:17px; color:#5a2a00;
    background:linear-gradient(180deg,#ffe27a,var(--gold) 45%,var(--gold-deep));
    box-shadow:0 4px 0 #b9791a;
    transition:transform .08s, box-shadow .08s;
  }
  .modal-confirm:active{ transform:translateY(3px); box-shadow:0 1px 0 #b9791a; }
  .modal-confirm:disabled{ filter:saturate(.4) brightness(.85); cursor:default; }
  .modal-close{
    display:block; width:100%; margin-top:10px; padding:10px;
    background:transparent; border:1.5px solid rgba(255,255,255,.15);
    border-radius:14px; cursor:pointer; font-family:'Jua',sans-serif;
    font-size:15px; color:rgba(255,255,255,.55);
    transition:border-color .15s, color .15s;
  }
  .modal-close:hover{ border-color:rgba(255,255,255,.3); color:var(--cream); }

  @media (prefers-reduced-motion: reduce){
    .display.win, .display.shake, .reel.hit, .lines line{ animation:none; stroke-dashoffset:0; }
    .reel.spinning .strip{ filter:none; }
  }
</style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <main class="machine">
    <div class="topbar">
      <button class="goldbar-btn" id="goldbarBtn" aria-label="금괴 금고" style="position:absolute;left:0;top:50%;transform:translateY(-50%);">
        🪙
        <span class="goldbar-badge" id="goldbarBadge" style="display:none">0</span>
      </button>
      <h1 class="title">오늘의 행운 슬롯</h1>
      <button class="mute" id="muteBtn" aria-label="소리 켜고 끄기"></button>
    </div>

    <!-- 금괴 모달 -->
    <div class="modal-overlay hidden" id="goldModal">
      <div class="modal-box">
        <div class="modal-title">🪙 금괴 금고</div>
        <div class="modal-stock" id="modalGoldStock">보유 : <strong id="modalGoldCount">0</strong></div>
        <div class="modal-tabs">
          <button class="modal-tab active" id="tabDeposit">입금 (코인→금괴)</button>
          <button class="modal-tab" id="tabWithdraw">출금 (금괴→코인)</button>
        </div>

        <!-- 입금 섹션 -->
        <div class="modal-section active" id="sectionDeposit">
          <div class="modal-label">변환할 코인 (조 단위)</div>
          <div class="modal-input-row" style="gap:8px;align-items:center;">
            <div style="flex:2;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;justify-content:center;">
              <div style="font-size:10px;color:#cbb6e8;letter-spacing:.5px;margin-bottom:2px;">보유 코인 (조)</div>
              <div style="font-size:15px;font-family:'Fredoka',sans-serif;color:var(--gold);font-weight:600;" id="depositAvailJo">0 조</div>
            </div>
            <input class="modal-input" id="depositInput" type="number" min="0" placeholder="입력" style="flex:1;min-width:0;">
          </div>
          <div class="modal-result" id="depositResult">금괴&nbsp;<strong>0</strong>&nbsp;개로 변환됩니다</div>
          <button class="modal-confirm" id="depositConfirm" disabled>입금하기</button>
        </div>

        <!-- 출금 섹션 -->
        <div class="modal-section" id="sectionWithdraw">
          <div class="modal-label">출금할 금괴 수 입력 (금괴 단위, 1,000개=상자 1개)</div>
          <div class="modal-input-row" style="gap:8px;align-items:center;">
            <div style="flex:2;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;justify-content:center;">
              <div style="font-size:10px;color:#cbb6e8;letter-spacing:.5px;margin-bottom:2px;">보유 금괴</div>
              <div style="font-size:15px;font-family:'Fredoka',sans-serif;color:var(--gold);font-weight:600;" id="withdrawAvailBars">0 개</div>
            </div>
            <input class="modal-input" id="withdrawInput" type="number" min="0" placeholder="입력" style="flex:1;min-width:0;">
          </div>
          <div class="modal-result" id="withdrawResult">코인&nbsp;<strong>0</strong>&nbsp;조로 환전됩니다</div>
          <button class="modal-confirm" id="withdrawConfirm" disabled>출금하기</button>
        </div>

        <button class="modal-close" id="modalClose">닫기</button>
      </div>
    </div>

    <div class="coins">
      <span class="label">내 코인</span>
      <span class="amount" id="coins">300</span>
      <svg class="coinicon" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#ffd24a" stroke="#d99a18" stroke-width="5"/><circle cx="50" cy="50" r="32" fill="none" stroke="#e8b430" stroke-width="3"/><text x="50" y="66" font-size="44" font-family="Fredoka,Arial,sans-serif" font-weight="700" fill="#b9791a" text-anchor="middle">₩</text></svg>
    </div>

    <div class="display" id="display">
      <div class="grid-wrap">
        <div class="grid-lock" id="gridLock"></div>
        <div class="reels" id="reels"></div>
        <svg class="lines" id="lines" preserveAspectRatio="none"></svg>
      </div>
    </div>

    <div class="message" id="message">버튼을 눌러 행운을 돌려보세요</div>

    <div class="betRow" id="betRow">
      <button class="spin betBtn" id="betBtn1" data-pct="0" data-fixed="100">100<span class="pt">포인트</span></button>
      <button class="spin betBtn" id="betBtn2" data-pct="10">10%</button>
      <button class="spin betBtn" id="betBtn3" data-pct="30">30%</button>
      <button class="spin betBtn" id="betBtn4" data-pct="60">60%</button>
      <button class="spin betBtn" id="betBtn5" data-pct="90">90%</button>
    </div>
  </main>

<script>
(function(){
  var SVG = {
    cherry:'<svg viewBox="0 0 100 100"><path d="M52 26 C60 36 72 38 78 50" fill="none" stroke="#5a8f3a" stroke-width="5" stroke-linecap="round"/><path d="M52 26 C44 36 36 40 30 52" fill="none" stroke="#5a8f3a" stroke-width="5" stroke-linecap="round"/><path d="M52 26 q6 -8 14 -7" fill="none" stroke="#5a8f3a" stroke-width="5" stroke-linecap="round"/><circle cx="30" cy="66" r="17" fill="#e63950"/><circle cx="70" cy="66" r="17" fill="#ff5470"/><ellipse cx="24" cy="60" rx="5" ry="3" fill="#fff" opacity=".55"/><ellipse cx="64" cy="60" rx="5" ry="3" fill="#fff" opacity=".55"/></svg>',
    lemon:'<svg viewBox="0 0 100 100"><g transform="rotate(-20 50 52)"><ellipse cx="50" cy="52" rx="34" ry="23" fill="#ffd83d"/><ellipse cx="40" cy="44" rx="11" ry="5" fill="#fff" opacity=".5"/></g><circle cx="16" cy="42" r="3" fill="#e8b800"/><circle cx="84" cy="62" r="3" fill="#e8b800"/></svg>',
    orange:'<svg viewBox="0 0 100 100"><circle cx="50" cy="58" r="29" fill="#ff9f1c"/><circle cx="40" cy="48" r="8" fill="#fff" opacity=".4"/><path d="M50 30 q9 -9 18 -6 q-3 9 -14 10 z" fill="#5a8f3a"/></svg>',
    bell:'<svg viewBox="0 0 100 100"><path d="M50 22 a25 25 0 0 1 25 25 v16 l6 9 h-62 l6 -9 v-16 a25 25 0 0 1 25 -25 z" fill="#ffd24a" stroke="#d99a18" stroke-width="3"/><circle cx="50" cy="84" r="7" fill="#d99a18"/><circle cx="50" cy="18" r="5" fill="#d99a18"/><path d="M42 40 a14 14 0 0 0 -8 12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".5"/></svg>',
    star:'<svg viewBox="0 0 100 100"><path d="M50 14 L61 40 L89 42 L67 60 L74 88 L50 72 L26 88 L33 60 L11 42 L39 40 Z" fill="#ffd24a" stroke="#d99a18" stroke-width="3" stroke-linejoin="round"/></svg>',
    diamond:'<svg viewBox="0 0 100 100"><path d="M30 30 H70 L86 48 L50 88 L14 48 Z" fill="#5fd0ff"/><path d="M30 30 L50 48 L70 30 Z" fill="#bff0ff"/><path d="M14 48 L50 48 L50 88 Z" fill="#3bb6ef"/><path d="M50 48 L70 30 L86 48 Z" fill="#7fdcff"/><path d="M14 48 L30 30 L50 48 Z" fill="#9fe6ff"/><path d="M50 48 L70 48 L50 88 Z" fill="#2a9ad0"/></svg>',
    seven:'<svg viewBox="0 0 100 100"><rect x="22" y="22" width="56" height="56" rx="11" fill="#1f6fd6" stroke="#0d3f80" stroke-width="4"/><text x="51" y="70" font-size="48" font-family="Fredoka,Arial,sans-serif" font-weight="700" fill="#fff" text-anchor="middle">7</text></svg>'
  };
  var SPK_ON  = '<svg viewBox="0 0 100 100" fill="#fff6e6"><path d="M20 38 H38 L58 20 V80 L38 62 H20 Z"/><path d="M68 36 a20 20 0 0 1 0 28" fill="none" stroke="#fff6e6" stroke-width="6" stroke-linecap="round"/><path d="M76 28 a32 32 0 0 1 0 44" fill="none" stroke="#fff6e6" stroke-width="6" stroke-linecap="round"/></svg>';
  var SPK_OFF = '<svg viewBox="0 0 100 100" fill="#fff6e6"><path d="M20 38 H38 L58 20 V80 L38 62 H20 Z"/><path d="M66 38 L86 62 M86 38 L66 62" stroke="#fff6e6" stroke-width="6" stroke-linecap="round"/></svg>';

  var SYMBOLS = ['cherry','lemon','orange','bell','star','diamond','seven'];
  var COMMON  = ['cherry','lemon','orange','bell','star'];
  var TRIPLE  = { seven:30, diamond:18, star:10, bell:7, orange:4, lemon:4, cherry:5 };
  var COST = 20;

  var LINES = [
    {cells:[0,1,2], diag:false}, {cells:[3,4,5], diag:false}, {cells:[6,7,8], diag:false},
    {cells:[0,3,6], diag:false}, {cells:[1,4,7], diag:false}, {cells:[2,5,8], diag:false},
    {cells:[0,4,8], diag:true},  {cells:[2,4,6], diag:true}
  ];

  var reelsEl = document.getElementById('reels');
  var linesSvg = document.getElementById('lines');
  var coinsEl = document.getElementById('coins');
  var msgEl   = document.getElementById('message');
  var betBtns = Array.from(document.querySelectorAll('.betBtn'));
  var display = document.getElementById('display');
  var muteBtn = document.getElementById('muteBtn');

  var reels=[], strips=[];
  for(var i=0;i<9;i++){
    var r=document.createElement('div'); r.className='reel';
    var s=document.createElement('div'); s.className='strip';
    r.appendChild(s); reelsEl.appendChild(r);
    reels.push(r); strips.push(s);
  }

  var COINS_KEY = 'luckyslot_coins';
  var INIT_COINS = 100000;
  var savedCoins = parseInt(localStorage.getItem(COINS_KEY), 10);
  if(isNaN(savedCoins) || savedCoins < 1000){ savedCoins = INIT_COINS; localStorage.setItem(COINS_KEY, INIT_COINS); }
  var coins = savedCoins;
  var spinning=false, muted=false;
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

  // ---------- fit board to one screen: set cell height = actual reel height ----------
  function fitBoard(){
    var h = reels[0].getBoundingClientRect().height;
    if(h>0) document.documentElement.style.setProperty('--cell-h', h+'px');
  }

  // ---------- audio ----------
  var actx=null;
  function audio(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
  function beep(freq,dur,type,vol){
    if(muted) return;
    dur=dur||0.08; type=type||'square'; vol=vol||0.15;
    try{

      g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+dur);
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
    }catch(e){}
  }

  function spinReel(reelEl, strip, target, startDelay){
    var MAX_SPEED = 32;
    var ACCEL_MS  = 300;
    var FAST_MS   = 500;

    // 감속 프로파일 [속도px/frame, 프레임수]
    var DECEL = [
      [30, 8],
      [26, 9],
      [22, 10],
      [18, 11],
      [14, 12],
      [10, 13],
      [7,  13],
      [4,  14],
      [2,  15],
      [1,  10],
    ];
    var decelDist = DECEL.reduce(function(s,d){ return s+d[0]*d[1]; }, 0);

    return new Promise(function(res){
      setTimeout(function(){
        // ── 역방향 설계 ──────────────────────────────────────────
        // 1) target은 항상 strip의 맨 끝 셀 (인덱스 = TOTAL-1)
        // 2) snapPos = TOTAL * ch  (target 셀 상단이 뷰포트 상단에 오는 위치)
        //    → 이것만 정확하면 snap 시 그림 안 바뀜
        // 3) decelStart = snapPos - decelDist
        //    → 여기서부터 감속 시작하면 decelDist 이동 후 정확히 snapPos 도달
        // 4) FAST_POOL: decelStart 이전에서만 순환

        // ch = reel 컨테이너의 실제 렌더 높이 (가장 신뢰도 높음)
        // reel 1칸 = 셀 1개이므로 컨테이너 높이 = 셀 높이
        var ch = reelEl.getBoundingClientRect().height;

        // 그래도 0이면 CSS 변수 → 최종 fallback 80
        if(!ch || ch <= 0){
          ch = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell-h')) || 80;
        }

        var PAD       = Math.ceil(decelDist / ch) + 2; // 감속 구간 셀 수 (여유 포함)
        var FAST_POOL = 20;
        var TOTAL     = FAST_POOL + PAD; // target 인덱스 = TOTAL

        // strip 구성: 랜덤 TOTAL개 + target 1개
        var list = [];
        for(var i = 0; i < TOTAL; i++) list.push(pick(SYMBOLS));
        list.push(target);
        fillCells(strip, list);
        strip.style.transition = 'none';
        strip.style.transform  = 'translateY(0)';
        reelEl.classList.add('spinning');
        void strip.offsetHeight;

        // snapPos: 실제 마지막 셀(target)의 offsetTop을 직접 읽어 소수점 누적 오차 차단
        var cells = strip.querySelectorAll('.cell');
        var lastCell = cells[cells.length - 1];
        var snapPos = lastCell ? lastCell.offsetTop : TOTAL * ch;

        var decelStart = snapPos - decelDist; // 감속 시작 위치
        var loopCeil   = Math.max(ch, decelStart - ch * 3); // 고속 순환 상한 (최소 ch 보장)

        var pos     = 0;
        var startT  = null;
        var inDecel = false;
        var dIdx = 0, dFrame = 0;

        function frame(now){
          if(!startT) startT = now;
          var elapsed = now - startT;

          if(!inDecel){
            var speed = elapsed < ACCEL_MS
              ? MAX_SPEED * (elapsed / ACCEL_MS)
              : MAX_SPEED;

            pos += speed;

            // loopCeil 넘으면 앞으로 되감기 (감속 구간 절대 침범 안 함)
            if(pos >= loopCeil) pos = pos % loopCeil;

            // 최소 고속시간 경과 → 감속 돌입
            if(elapsed >= ACCEL_MS + FAST_MS){
              inDecel = true;
              pos = decelStart; // 정확히 감속 시작점으로 고정
              reelEl.classList.remove('spinning');
              strip.style.transform = 'translateY(-' + pos + 'px)';
              requestAnimationFrame(frame);
              return;
            }

            strip.style.transform = 'translateY(-' + pos + 'px)';
            requestAnimationFrame(frame);
            return;
          }

          // 감속
          var spd = DECEL[dIdx][0];
          dFrame++;
          if(dFrame >= DECEL[dIdx][1]){ dIdx++; dFrame = 0; }

          // snapPos 도달 or 단계 소진 → target 위치에 정확히 snap
          if(dIdx >= DECEL.length || pos + spd >= snapPos){
            // strip을 target 심볼 1개만 남기고 transform 리셋
            // → 이후 레이아웃 재계산이 일어나도 그림이 흔들리지 않음
            strip.innerHTML = '<div class="cell">' + SVG[target] + '</div>';
            strip.style.transition = 'none';
            strip.style.transform  = 'translateY(0)';
            clunk();
            res();
            return;
          }

          pos += spd;
          strip.style.transform = 'translateY(-' + pos + 'px)';
          requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
      }, startDelay);
    });
  }

  function decideGrid(){
    var g=[]; for(var i=0;i<9;i++) g.push(pick(SYMBOLS));
    var r=Math.random();
    if(r<0.005){
      // 7 올매치 (0.5%)
      g=Array(9).fill('seven');
    } else if(r<0.015){
      // 일반 심볼 올매치 (1%)
      var s=pick(COMMON); g=Array(9).fill(s);
    } else if(r<0.030){
      // 7 라인 1개 (1.5%)
      pick(LINES).cells.forEach(function(i){ g[i]='seven'; });
    } else if(r<0.050){
      // 3줄 동시 적중 (2%)
      var s3=pick(COMMON);
      var chosen=[]; var pool=LINES.slice();
      for(var k=0;k<3;k++){
        var idx=Math.floor(Math.random()*pool.length);
        pool[idx].cells.forEach(function(i){ g[i]=s3; });
        chosen.push(pool[idx]); pool.splice(idx,1);
      }
    } else if(r<0.085){
      // 2줄 동시 적중 (3.5%)
      var s2=pick(COMMON);
      var p2=LINES.slice();
      var i2=Math.floor(Math.random()*p2.length);
      p2[i2].cells.forEach(function(i){ g[i]=s2; }); p2.splice(i2,1);
      var i2b=Math.floor(Math.random()*p2.length);
      p2[i2b].cells.forEach(function(i){ g[i]=s2; });
    } else if(r<0.120){
      // 1줄 적중 (3.5%)
      var s1=pick(COMMON); pick(LINES).cells.forEach(function(i){ g[i]=s1; });
    }
    // 88%: 꽝 — g 그대로 반환
    return g;
  }

  function score(grid){
    var total=0, wins=[], hitCells={};
    LINES.forEach(function(L){
      var a=grid[L.cells[0]], b=grid[L.cells[1]], c=grid[L.cells[2]];
      if(a===b && b===c){
        var pay=Math.round(TRIPLE[a]*(L.diag?1.5:1));
        total+=pay; wins.push({cells:L.cells,diag:L.diag,symbol:a,pay:pay});
        L.cells.forEach(function(i){ hitCells[i]=true; });
      }
    });
    var jackpot=wins.some(function(w){ return w.symbol==='seven'; });
    return { total:total, wins:wins, hitCells:Object.keys(hitCells).map(Number), jackpot:jackpot };
  }

  function fmtGoldBars(bars){
    var BARS_PER_BOX  = 1000; // 금괴 1,000개 = 상자 1개
    var BOXES_PER_VAULT = 1000; // 상자 1,000개 = 금고 1개
    var vault = Math.floor(bars / (BARS_PER_BOX * BOXES_PER_VAULT));
    var remainder = bars % (BARS_PER_BOX * BOXES_PER_VAULT);
    var box  = Math.floor(remainder / BARS_PER_BOX);
    var bar  = remainder % BARS_PER_BOX;
    var parts = [];
    if(vault > 0) parts.push('🏦 금고 ' + vault.toLocaleString('en-US') + '개');
    if(box  > 0) parts.push('📦 상자 ' + box.toLocaleString('en-US') + '개');
    if(bar  > 0 || parts.length === 0) parts.push('🪙 금괴 ' + bar.toLocaleString('en-US') + '개');
    return parts.join(' &nbsp; ');
  }

  function confetti(n){

    for(var i=0;i<n;i++) parts.push({
      x:Math.random()*canvas.width, y:-20*devicePixelRatio,

      r:(Math.random()*6+4)*devicePixelRatio, color:pick(COLORS),

  function drawC(){
    cx.clearRect(0,0,canvas.width,canvas.height);
    parts.forEach(function(p){
      p.vy+=0.12*devicePixelRatio; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      if(p.y>canvas.height*0.85) p.life-=0.03;
      cx.save(); cx.globalAlpha=Math.max(0,p.life); cx.translate(p.x,p.y); cx.rotate(p.rot);
      cx.fillStyle=p.color; cx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6); cx.restore();
    });
    parts=parts.filter(function(p){ return p.life>0 && p.y<canvas.height+40; });
    if(parts.length) requestAnimationFrame(drawC); else cx.clearRect(0,0,canvas.width,canvas.height);
  }

    var order=[0,3,6, 1,4,7, 2,5,8];
    var promises=order.map(function(idx,k){
      var col=Math.floor(k/3);
      return spinReel(reels[idx],strips[idx],grid[idx], col*400);
    });

    Promise.all(promises).then(function(){
      stopWhir();
      var res=score(grid);
      if(res.total>0){
        // 당첨: 연속꽝 리셋, 화면 밝게
        lossStreak = 0;
        display.style.filter = '';
        setCoins(coins+res.total*cost);
        res.hitCells.forEach(function(i){ reels[i].classList.add('hit'); });
        drawLines(res.wins);
        flash(winMessage(res), res.jackpot||res.wins.length>=2);
        if(res.jackpot){ display.classList.add('win','shake'); confetti(200); jackpotTune(); }
        else { display.classList.add('win'); confetti(50+res.wins.length*40); winTune(); }
      } else {
        // 꽝: 연속꽝 카운터 증가
        lossStreak++;
        // 니어미스 연출
        if(isNearMiss(grid)){
          var nearMissMsg = pick(['아까워!! 딱 하나 차이였어요!','한 끗 차이...! 다음엔 꼭!','거의 다 왔어요, 한 번 더!']);
          flash(nearMissMsg, false);

        } else {
          // 연속꽝 메시지
          if(lossStreak >= 7){
            flash('😱 ' + lossStreak + '연속 꽝... 폭발 직전?!', false);
          } else if(lossStreak >= 4){
            flash('🌑 ' + lossStreak + '연속 꽝, 뭔가 올 것 같은데...', false);
          } else {
            flash(pick(NOWIN), false);
          }
        }
        // 연속꽝 화면 어둡기 효과
        applyStreakFX();
      }
      spinning=false; setBetBtnsDisabled(false);
    });
  }

  // ---------- 베팅 (퍼센트 기반) ----------
  var currentPct = 10;
  var fixedBet = null; // null이면 퍼센트 베팅, 숫자면 고정 베팅
  var lossStreak = 0; // 연속 꽝 카운터

  function calcBet(pct){
    if(fixedBet !== null) return fixedBet;
    return Math.max(20, Math.floor(coins * pct / 100));
  }

  function setBetBtnsDisabled(disabled){
    betBtns.forEach(function(b){ b.disabled = disabled; });
  }

  function selectPct(pct, fixed){
    currentPct = pct;
    fixedBet = (fixed !== undefined) ? fixed : null;
    betBtns.forEach(function(b){
      var isFixed = b.dataset.fixed !== undefined;
      if(fixedBet !== null){
        b.classList.toggle('active', isFixed);
      } else {
        b.classList.toggle('active', !isFixed && parseInt(b.dataset.pct,10)===pct);
      }
    });
  }

  // ---------- 니어미스 판정 ----------
  function isNearMiss(grid){
    return LINES.some(function(L){
      var a=grid[L.cells[0]], b=grid[L.cells[1]], c=grid[L.cells[2]];
      return (a===b && b!==c) || (b===c && a!==c) || (a===c && a!==b);
    });
  }

  // ---------- 연속꽝 연출 ----------
  function applyStreakFX(){
    if(lossStreak >= 5){
      display.style.filter = 'brightness(0.72) saturate(0.6)';
    } else if(lossStreak >= 3){
      display.style.filter = 'brightness(0.88)';
    } else {
      display.style.filter = '';
    }
  }

  // ---------- init ----------
  strips.forEach(function(s){ fillCells(s,[pick(COMMON)]); });
  muteBtn.innerHTML=SPK_ON;
  betBtns.forEach(function(b){
    b.addEventListener('click',function(){
      var prevPct = currentPct;
      var prevFixed = fixedBet;
      if(b.dataset.fixed !== undefined){
        selectPct(0, parseInt(b.dataset.fixed, 10));
      } else {
        selectPct(parseInt(b.dataset.pct,10));
      }
      var started = doSpin();
      if(started===false) selectPct(prevPct, prevFixed !== null ? prevFixed : undefined);
    });
  });
  coinsEl.textContent = fmtCoins(coins);
  muteBtn.addEventListener('click',function(){
    muted=!muted; muteBtn.innerHTML= muted?SPK_OFF:SPK_ON;
    if(!muted) beep(523,0.08,'triangle',0.15);
  });
  function refit(){ resize(); fitBoard(); }
  refit();
  requestAnimationFrame(refit);
  setTimeout(refit,120);
  window.addEventListener('load', refit);
  window.addEventListener('resize', refit);
  window.addEventListener('orientationchange', function(){ setTimeout(refit,200); });
})();
</script>
</body>
</html>
